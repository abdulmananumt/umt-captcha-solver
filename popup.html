<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UMT CAPTCHA Auto-Fill</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --border:    #334155;
      --accent:    #38bdf8;
      --accent2:   #818cf8;
      --success:   #22c55e;
      --error:     #f87171;
      --text:      #f1f5f9;
      --muted:     #94a3b8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 300px;
      padding: 20px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--muted);
    }

    .status-text strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .captcha-badge {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 14px;
      display: none;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #fff;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .footer {
      margin-top: 16px;
      font-size: 10.5px;
      color: var(--border);
      text-align: center;
    }

    .dev-credit {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .dev-credit a {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }

    .dev-credit a:hover {
      color: var(--accent2);
    }

    .dev-credit svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🔐</div>
    <div class="header-text">
      <h1>UMT CAPTCHA Auto-Fill</h1>
      <p>online.umt.edu.pk</p>
    </div>
  </div>

  <div class="status-card" id="statusCard">
    <div class="status-icon" id="statusIcon">⏳</div>
    <div class="status-text">
      <strong id="statusTitle">Checking page…</strong>
      <span id="statusMsg">Please wait</span>
    </div>
  </div>

  <div class="captcha-badge" id="captchaBadge"></div>

  <button class="btn btn-primary" id="fillBtn" disabled>Fill CAPTCHA</button>
  <button class="btn btn-secondary" id="openBtn">Open UMT Login</button>

  <div class="footer">Auto-fills on page load · Works on login page only</div>
